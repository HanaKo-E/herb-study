<!DOCTYPE html>
<html lang="zh-Hant">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>藥性 – 溫</title>
   <style>
       /* 1. 更新 CSS 變數以符合紫色系主題 */
       :root { 
           --text-white: #ffffff; 
           --main-bg: #F7F3F0; 
           --title-color: #433e56; /* 紫色系主色 */
           --btn-color: #5a546e;   /* 紫色系次色 */
       }
       body { font-family: sans-serif; background-color: var(--main-bg); padding: 10px; display: flex; flex-direction: column; align-items: center; }
       .cabinet-section { width: 100%; max-width: 500px; }
       .series-heading { text-align: center; color: var(--title-color); background: rgba(67, 62, 86, 0.1); padding: 8px; border-radius: 6px; margin: 10px 0; font-size: 1.2rem; font-weight: bold; }
       .lattice-unit { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; padding: 8px; margin-bottom: 8px; border-radius: 8px; }
       
       /* 純文字格子樣式 */
       .drawer-text { 
           background: rgba(255, 255, 255, 0.15); 
           aspect-ratio: 5 / 1; 
           display: flex; 
           align-items: center; 
           justify-content: center; /* 讓文字整體置中 */
           border: 1px solid rgba(255, 255, 255, 0.25); 
           border-radius: 4px; 
           color: var(--text-white); 
           cursor: default; 
           pointer-events: none;
       }
       /* 移除原本的 .id 樣式，並讓 .name 填滿寬度置中 */
       .drawer-text .name { font-size: 1.1rem; font-weight: bold; width: 100%; text-align: center; }
       
       .nav-footer { display: flex; gap: 10px; margin-top: 20px; width: 100%; max-width: 500px; }
       .nav-btn { flex: 1; text-align: center; padding: 12px; background: var(--btn-color); color: white; text-decoration: none; border-radius: 25px; font-weight: bold; }
   </style>
</head>
<body>
   <div class="cabinet-section" id="container">
       <div class="series-heading">藥性 – 溫</div>
   </div>
   <div class="nav-footer">
       <a href="index.html" class="nav-btn">← 返回圖鑑</a>
       <a href="cabinet_800.html" class="nav-btn">切換 800 系 →</a>
   </div>
 
   <script>
       // 更新後的資料矩陣：保留層數、移除 ID、套用全新六層著名單
       const CABINET_DATA_700 = [
           { layer: "第一層", items: [{ name: "麻黃" }, { name: "羌活" }, { name: "細辛" }, { name: "辛夷" }] },
           { layer: "第二層", items: [{ name: "木瓜" }, { name: "鹿茸" }, { name: "桂枝" }, { name: "生薑" }] },
           { layer: "第三層", items: [{ name: "白芷" }, { name: "藁本" }, { name: "蔥白" }, { name: "當歸" }] },
           { layer: "第四層", items: [{ name: "紫蘇葉" }, { name: "蒼耳子" }, { name: "威靈仙" }] },
           { layer: "第五層", items: [] },
           { layer: "第六層", items: [] }
       ];
 
       // 2. 700 系指定的紫色碼
       const purpleColors = ["#433e56", "#5a546e", "#68627c", "#76708a", "#847e98", "#928ca6"];
       const container = document.getElementById('container');
 
       CABINET_DATA_700.forEach((layer, i) => {
           // 即使 items 是空的，依然會建立這一層的彩色基底外盒
           const unit = document.createElement('div');
           unit.className = 'lattice-unit';
           unit.style.backgroundColor = purpleColors[i % purpleColors.length];
           
           layer.items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'drawer-text';
                // 修改：只保留顯示藥材名稱的區塊，不生成 ID 欄位
                div.innerHTML = `<div class="name">${item.name}</div>`;
                unit.appendChild(div);
           });
           container.appendChild(unit);
       });
   </script>
</body>
</html>
