<!DOCTYPE html>
<html lang="zh-Hant">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>藥性 - 微寒 與 大寒</title>
   <style>
       /* 更新 CSS 變數以符合綠色系主題 */
       :root { 
           --text-white: #ffffff; 
           --main-bg: #F7F3F0; 
           --title-color: #31483c; /* 調整為深綠色系主色 */
           --btn-color: #587269;   /* 調整為綠色系次色 */
       }
       body { font-family: sans-serif; background-color: var(--main-bg); padding: 10px; display: flex; flex-direction: column; align-items: center; }
       .cabinet-section { width: 100%; max-width: 500px; }
       
       /* 分類大標題字體大小放大至 1.5rem */
       .series-heading { text-align: center; color: var(--title-color); background: rgba(82, 171, 163, 0.1); padding: 10px; border-radius: 6px; margin: 15px 0 10px 0; font-size: 1.5rem; font-weight: bold; }
       .lattice-unit { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; padding: 8px; margin-bottom: 8px; border-radius: 8px; }
       
       /* 純文字格子樣式 */
       .drawer-text { 
           background: rgba(255, 255, 255, 0.15); 
           aspect-ratio: 4 / 1; /* 寬高比例由 5/1 微調為 4/1，讓字體放大後上下留白依然完美舒適 */
           display: flex; 
           align-items: center; 
           justify-content: center; /* 讓文字整體水平垂直置中 */
           border: 1px solid rgba(255, 255, 255, 0.25); 
           border-radius: 4px; 
           color: var(--text-white); 
           cursor: default; 
           pointer-events: none;
       }
       /* 藥材名稱字體大小放大至 1.4rem，填滿格子並置中 */
       .drawer-text .name { font-size: 1.4rem; font-weight: bold; width: 100%; text-align: center; }
       
       .nav-footer { display: flex; gap: 10px; margin-top: 20px; width: 100%; max-width: 500px; }
       .nav-btn { flex: 1; text-align: center; padding: 12px; background: var(--btn-color); color: white; text-decoration: none; border-radius: 25px; font-weight: bold; }
   </style>
</head>
<body>
   <div class="cabinet-section" id="container"></div>

     <div class="nav-footer">
    <a href="index.html" class="nav-btn">← 返回圖鑑</a>
    
    <select class="nav-btn" onchange="if(this.value) location.href=this.value;" style="text-align-last: center; border: none; font-size: inherit; font-family: inherit; -webkit-appearance: none; cursor: pointer;">
        <option value="">切換其他藥性 ↓</option>
        <option value="cabinet_wei_da_han.html">微寒 / 大寒</option>
        <option value="cabinet_han.html">寒</option>
        <option value="cabinet_wen_wei_wen.html">溫 / 微溫</option>
        <option value="cabinet_ping_liang.html">平 / 涼</option>
    </select>
</div>
 
   <script>
       // 第一個區塊：藥性 - 微寒 (1~3層名單)
       const DATA_微寒 = [
           { layer: "第一層", items: [{ name: "菊花" }, { name: "荊子" }, { name: "柴胡" }, { name: "升麻" }] },
           { layer: "第二層", items: [{ name: "決明子" }, { name: "天花粉" }, { name: "連翹" }, { name: "玄參" }] },
           { layer: "第三層", items: [{ name: "絡石藤" }, { name: "石斛" }, { name: "百合" }] }
       ];

       // 第二個區塊：藥性 - 大寒 (第5層名單)
       const DATA_大寒 = [
           { layer: "第五層", items: [{ name: "石膏" }] }
       ];
 
       const container = document.getElementById('container');
 
       // 渲染函數：負責產出大標題、名格與設定指定的背景顏色
       function renderSection(titleText, layerData, bgColor) {
           // 1. 建立分類大標題
           const heading = document.createElement('div');
           heading.className = 'series-heading';
           heading.innerText = titleText;
           container.appendChild(heading);

           // 2. 建立每一層的百子櫃外盒
           layerData.forEach(layer => {
               const unit = document.createElement('div');
               unit.className = 'lattice-unit';
               unit.style.backgroundColor = bgColor; // 套用該區塊指定的統一顏色
               
               layer.items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'drawer-text';
                    // 只生成藥材名稱，不含 ID
                    div.innerHTML = `<div class="name">${item.name}</div>`;
                    unit.appendChild(div);
               });
               container.appendChild(unit);
           });
       }

       // 執行渲染第一個區塊：藥性 - 微寒，套用指定色 #82ABA3
       renderSection("藥性 – 微寒", DATA_微寒, "#82ABA3");

       // 執行渲染第二個區塊：藥性 - 大寒，套用指定色 #BFD1C4
       renderSection("藥性 – 大寒", DATA_大寒, "#BFD1C4");
   </script>
</body>
</html>
